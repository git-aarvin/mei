<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Models Engineering Index</title>
	<meta name="description" content="Language model performance on engineering tasks, compared by cost and token use.">
	<meta name="theme-color" content="#ffffff">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop stop-color='%23f0a9b8'/%3E%3Cstop offset='1' stop-color='%237d9fd0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='11' fill='url(%23g)'/%3E%3C/svg%3E">
	<meta property="og:type" content="website">
	<meta property="og:title" content="Models Engineering Index">
	<meta property="og:description" content="Mei calculates language models' practical performance on engineering tasks.">
	<meta property="og:image" content="https://raw.githubusercontent.com/git-aarvin/mei/refs/heads/main/source/cost.png">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<main>
		<header>
			<h1 class="intro">
				<span class="intro-wide"><span class="brand">Mei</span><span class="callout">&mdash;or, the Models Engineering Index&mdash;</span>calculates language models' practical performance on engineering tasks.</span>
				<span class="intro-narrow"><span class="brand">Mei</span> calculates language models' engineering performance.</span>
			</h1>
		</header>
		<noscript><p class="note">This page needs JavaScript to draw the chart and rankings.</p></noscript>
		<section class="viz" aria-labelledby="chart-title">
			<p class="chart-title" id="chart-title">Performance versus
				<button class="metric on" data-metric="cost" aria-pressed="true">cost</button><span aria-hidden="true"> or </span><button class="metric" data-metric="tokens" aria-pressed="false">tokens</button>.
			</p>
			<div id="chart" class="chart"></div>
			<section class="bars" aria-labelledby="bars-title">
				<h2 id="bars-title" class="chart-title">Ranked by
					<button class="bar-metric on" data-bar-metric="y" aria-pressed="true">index</button><span aria-hidden="true">, </span><button class="bar-metric" data-bar-metric="cost" aria-pressed="false">cost</button><span aria-hidden="true"> or </span><button class="bar-metric" data-bar-metric="tokens" aria-pressed="false">tokens</button>.
				</h2>
				<div id="bars" class="bars-chart"></div>
			</section>
		</section>
		<section class="rankings" aria-labelledby="rankings-title">
			<h2 id="rankings-title" class="visually-hidden">Rankings</h2>
			<div id="table"></div>
		</section>
		<footer>
			<p>Data from <a href="https://cognition.ai">Cognition</a>, <a href="https://cursor.com">Cursor</a>, the <a href="https://laude.org">Laude Institute</a> and <a href="https://vals.ai">Vals AI</a>. Source on <a href="https://github.com/git-aarvin/mei" target="_blank">GitHub</a>.</p>
		</footer>
	</main>
	<script type="module" src="js/main.js"></script>
</body>
</html>
