<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mei — Models Engineering Index</title>
	<meta name="description" content="Language model performance on engineering tasks, compared by cost and token use.">
	<meta name="theme-color" content="#ffffff">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c66e53'/%3E%3C/svg%3E">
	<meta property="og:type" content="website">
	<meta property="og:title" content="Mei — Models Engineering Index">
	<meta property="og:description" content="Language model performance on engineering tasks, compared by cost and token use.">
	<meta property="og:image" content="https://raw.githubusercontent.com/git-aarvin/mei/refs/heads/main/source/cost.png">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<main>
		<header>
			<h1 class="intro">Mei&mdash;or, the Models Engineering Index&mdash;calculates language models' practical performance on engineering tasks.</h1>
		</header>
		<noscript><p class="note">This page needs JavaScript to draw the chart and rankings.</p></noscript>
		<section class="viz" aria-labelledby="chart-title">
			<p class="chart-title" id="chart-title">Performance vs
				<button class="metric on" data-metric="cost" aria-pressed="true">cost</button><span aria-hidden="true"> / </span><button class="metric" data-metric="tokens" aria-pressed="false">tokens</button>
			</p>
			<div id="chart" class="chart"></div>
		</section>
		<section class="rankings" aria-labelledby="rankings-title">
			<h2 id="rankings-title" class="visually-hidden">Rankings</h2>
			<div id="table"></div>
		</section>
		<footer>
			<p>Data from <a href="https://cognition.ai">Cognition</a>, <a href="https://cursor.com">Cursor</a>, the <a href="https://laude.org">Laude Institute</a> and <a href="https://vals.ai">Vals AI</a>. <a href="https://github.com/git-aarvin/mei">Source on GitHub</a>.</p>
		</footer>
	</main>
	<script type="module" src="js/main.js"></script>
</body>
</html>
